name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    concurrency:
      group: edgetunnel-deploy
      cancel-in-progress: false
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Record worker fingerprint before sync
        id: before
        run: |
          echo "hash=$(git rev-parse HEAD:_worker.js)" >> "$GITHUB_OUTPUT"

      - name: Sync upstream changes
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          if git diff --quiet HEAD upstream/main; then
            # 内容和上游一致，直接对齐，顺带清理历史分叉留下的多余 merge commit
            git reset --hard upstream/main
            git push --force-with-lease origin main
          else
            # 有本地修改，保持原来的合并方式，不覆盖任何人的改动
            if ! git pull --no-rebase upstream main; then
              echo "[Error] 合并上游变更产生冲突，自动同步已暂停，请手动 Sync Fork 并解决冲突。"
              echo "[Error] Merge conflict detected while syncing upstream. Please sync your fork manually and resolve the conflicts."
              exit 1
            fi
            git push origin main
          fi

      - name: Install pinned wrangler
        run: npm install --no-save wrangler@4.61.1

      - name: Detect whether worker code changed
        id: chk
        env:
          BEFORE_HASH: ${{ steps.before.outputs.hash }}
        run: |
          AFTER_HASH=$(git rev-parse HEAD:_worker.js)
          if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "==> _worker.js unchanged ($AFTER_HASH); skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "==> _worker.js changed: $BEFORE_HASH -> $AFTER_HASH; deploying."
          fi

      - name: Deploy synced Worker
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "[Error] Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "[Error] Missing GitHub Actions variable CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

          cp wrangler.toml .wrangler-edgetunnel.toml
          cat >> .wrangler-edgetunnel.toml <<'EOF'

          workers_dev = true
          preview_urls = true

          [[kv_namespaces]]
          binding = "KV"
          id = "44e7f471224e4658ab099cc8908361ed"

          [observability]
          enabled = true
          head_sampling_rate = 1
          EOF

          npx --no-install wrangler deploy \
            --config .wrangler-edgetunnel.toml \
            --name edgetunnel \
            --keep-vars \
            --domains v.zjyyy.top
